name = "pethealth"
main = "workers/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding — set database_id after `npx wrangler d1 create pethealth-db`
[[d1_databases]]
binding = "DB"
database_name = "pethealth-db"
database_id = "PLACEHOLDER_RUN_WRANGLER_D1_CREATE"

# Static assets — the built frontend from dist/public
[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Environment variables (non-sensitive)
[vars]
NODE_ENV = "production"

# Sensitive values: set via `npx wrangler secret put <KEY>`
# Required secrets:
# - JWT_SECRET (any random 32+ char string)
#
# Optional (post-MVP):
# - STRIPE_SECRET_KEY
# - STRIPE_WEBHOOK_SECRET
# - S3_BUCKET / S3_REGION / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY

[env.production]
name = "pethealth"
